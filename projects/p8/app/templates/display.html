<h2>Employee Details</h2>

<table border="1">

<tr>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Date</th>

<th>Job</th>

<th>Salary</th>

</tr>

{% for i in employees %}

<tr>

<td>{{i.name}}</td>

<td>{{i.email}}</td>

<td>{{i.phone}}</td>

<td>{{i.date}}</td>

<td>{{i.job}}</td>

<td>{{i.salary}}</td>

</tr>

{% endfor %}

</table>

<button>

Back

</button>

</a>
